<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR Generator</title>
    <meta
      name="description"
      content="Turn each line of text into a QR code. One line downloads a PNG. Several lines download a ZIP."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>QR Generator</h1>
        <p>Enter one text or link per line. Each line becomes its own QR code.</p>
      </header>

      <textarea
        id="input"
        spellcheck="false"
        autofocus
        placeholder="https://example.com&#10;Hello world&#10;Another line, another QR code"
      ></textarea>

      <footer>
        <span id="counter">0 QR codes</span>
        <button id="generate" type="button" disabled>Generate</button>
      </footer>

      <p id="status" role="status" aria-live="polite"></p>

      <p class="source">
        Desktop app source:
        <a href="https://github.com/aneebji/QRGenerator">github.com/aneebji/QRGenerator</a>
      </p>
    </main>

    <script src="vendor/qrcode.min.js"></script>
    <script src="vendor/jszip.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
